
<h2 class="sr-only">AI Portfolio Builder — chat to populate your portfolio in real time</h2>
<style>
* { box-sizing: border-box; }
.bar-fill { transition: width 0.6s cubic-bezier(.4,0,.2,1); }
.msg-bubble { animation: pop 0.2s ease; }
@keyframes pop { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.tab-btn { font-size:12px; padding:4px 12px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); background:transparent; cursor:pointer; color:var(--color-text-secondary); transition:all 0.15s; }
.tab-btn.active { background:var(--color-background-secondary); color:var(--color-text-primary); border-color:var(--color-border-secondary); }
.send-btn:disabled { opacity:0.4; cursor:not-allowed; }
.dots span { animation: blink 1.2s infinite; display:inline-block; }
.dots span:nth-child(2){ animation-delay:0.2s; }
.dots span:nth-child(3){ animation-delay:0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
input, textarea { outline:none; font-family:inherit; }
input:focus { border-color:var(--color-border-primary) !important; }
</style>

<div id="root" style="padding:1rem 0;min-height:580px;"></div>

<script>
const portfolio = {
  name: "Your Name",
  tagline: "Tell me about yourself to get started ✨",
  skills: [],
  grades: [],
  abilities: []
};

let chatHistory = [];
let displayMsgs = [
  { from:"ai", text:"Hey! 👋 I'm your portfolio AI. Just tell me about yourself — your skills, grades, or special abilities — and I'll build your portfolio as we chat!" }
];
let loading = false;
let currentView = "split";

const systemPrompt = () => `You are a portfolio-building AI for a student. The user describes themselves. Extract info and return ONLY valid JSON (no markdown, no backticks, no extra text):
{"name":string|null,"tagline":string|null,"skills":[{"name":string,"level":"beginner"|"intermediate"|"advanced","emoji":string}]|null,"grades":[{"subject":string,"score":string,"note":string|null}]|null,"abilities":[{"title":string,"desc":string,"emoji":string}]|null,"reply":string}
Rules: only include keys with NEW info. Never duplicate existing entries. Keep descs concise. Be warm in reply.
Current portfolio: ${JSON.stringify(portfolio)}`;

const levelW = {beginner:"33%",intermediate:"66%",advanced:"100%"};
const levelC = {beginner:"var(--color-text-info)",intermediate:"var(--color-text-success)",advanced:"var(--color-text-warning)"};
const levelBg = {beginner:"var(--color-background-info)",intermediate:"var(--color-background-success)",advanced:"var(--color-background-warning)"};

function initials(name) {
  return name.split(" ").filter(Boolean).map(w=>w[0]).join("").toUpperCase().slice(0,2) || "?";
}

function render() {
  const root = document.getElementById("root");
  const init = initials(portfolio.name);

  const portfolioPane = `
    <div style="display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:520px;padding-right:4px;">
      <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;">
        <div style="width:46px;height:46px;border-radius:50%;background:var(--color-background-info);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:var(--color-text-info);flex-shrink:0;">${init}</div>
        <div>
          <p style="margin:0;font-size:16px;font-weight:500;color:var(--color-text-primary);">${portfolio.name}</p>
          <p style="margin:0;font-size:12px;color:var(--color-text-secondary);">${portfolio.tagline}</p>
        </div>
      </div>

      <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;">
        <p style="margin:0 0 10px;font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.08em;">Skills</p>
        ${portfolio.skills.length===0
          ? `<p style="margin:0;font-size:13px;color:var(--color-text-tertiary);font-style:italic;">Tell me your skills →</p>`
          : portfolio.skills.map(s=>`
            <div style="margin-bottom:10px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
                <span style="font-size:13px;color:var(--color-text-primary);">${s.emoji} ${s.name}</span>
                <span style="font-size:10px;padding:2px 8px;border-radius:100px;background:${levelBg[s.level]};color:${levelC[s.level]};">${s.level}</span>
              </div>
              <div style="height:4px;background:var(--color-background-secondary);border-radius:2px;">
                <div class="bar-fill" style="height:100%;width:${levelW[s.level]};background:${levelC[s.level]};border-radius:2px;"></div>
              </div>
            </div>`).join("")}
      </div>

      <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;">
        <p style="margin:0 0 10px;font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.08em;">Grades</p>
        ${portfolio.grades.length===0
          ? `<p style="margin:0;font-size:13px;color:var(--color-text-tertiary);font-style:italic;">Share your academic results →</p>`
          : `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;">${
              portfolio.grades.map(g=>`
                <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 8px;text-align:center;">
                  <p style="margin:0 0 2px;font-size:18px;font-weight:500;color:var(--color-text-success);">${g.score}</p>
                  <p style="margin:0;font-size:11px;color:var(--color-text-secondary);">${g.subject}</p>
                  ${g.note?`<p style="margin:3px 0 0;font-size:10px;color:var(--color-text-tertiary);">${g.note}</p>`:""}
                </div>`).join("")
            }</div>`}
      </div>

      <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;">
        <p style="margin:0 0 10px;font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.08em;">Special Abilities</p>
        ${portfolio.abilities.length===0
          ? `<p style="margin:0;font-size:13px;color:var(--color-text-tertiary);font-style:italic;">What makes you unique? →</p>`
          : portfolio.abilities.map(a=>`
            <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;">
              <span style="font-size:22px;line-height:1;">${a.emoji}</span>
              <div>
                <p style="margin:0 0 2px;font-size:13px;font-weight:500;color:var(--color-text-primary);">${a.title}</p>
                <p style="margin:0;font-size:12px;color:var(--color-text-secondary);line-height:1.5;">${a.desc}</p>
              </div>
            </div>`).join("")}
      </div>
    </div>`;

  const chatPane = `
    <div style="display:flex;flex-direction:column;height:520px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;">
      <div id="msgs" style="flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:10px;">
        ${displayMsgs.map(m=>`
          <div class="msg-bubble" style="display:flex;justify-content:${m.from==="user"?"flex-end":"flex-start"};">
            <div style="max-width:85%;padding:8px 12px;border-radius:${m.from==="user"?"12px 12px 3px 12px":"12px 12px 12px 3px"};background:${m.from==="user"?"var(--color-background-info)":"var(--color-background-secondary)"};font-size:13px;color:${m.from==="user"?"var(--color-text-info)":"var(--color-text-primary)"};line-height:1.5;">
              ${m.text}
            </div>
          </div>`).join("")}
        ${loading?`<div style="display:flex;justify-content:flex-start;"><div style="padding:8px 14px;border-radius:12px 12px 12px 3px;background:var(--color-background-secondary);font-size:13px;color:var(--color-text-secondary);" class="dots"><span>·</span><span>·</span><span>·</span></div></div>`:""}
        <div id="msgEnd"></div>
      </div>
      <div style="padding:0.75rem;border-top:0.5px solid var(--color-border-tertiary);display:flex;gap:8px;">
        <input id="chatInput" value="" placeholder="Tell me about yourself..." ${loading?"disabled":""} style="flex:1;font-size:13px;padding:8px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);" />
        <button id="sendBtn" class="send-btn" ${loading?"disabled":""} style="padding:8px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-info);color:var(--color-text-info);font-size:13px;cursor:pointer;font-weight:500;">Send ↗</button>
      </div>
    </div>`;

  root.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;padding-bottom:0.75rem;border-bottom:0.5px solid var(--color-border-tertiary);">
      <div>
        <p style="margin:0;font-size:14px;font-weight:500;color:var(--color-text-primary);">Portfolio Builder</p>
        <p style="margin:0;font-size:11px;color:var(--color-text-secondary);">AI-powered · Chat to fill your portfolio · GitHub Pages ready</p>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="tab-btn ${currentView==="portfolio"?"active":""}" onclick="setView('portfolio')">portfolio</button>
        <button class="tab-btn ${currentView==="split"?"active":""}" onclick="setView('split')">split</button>
        <button class="tab-btn ${currentView==="chat"?"active":""}" onclick="setView('chat')">chat</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:${currentView==="split"?"1fr 1fr":"1fr"};gap:12px;align-items:start;">
      ${currentView!=="chat"?portfolioPane:""}
      ${currentView!=="portfolio"?chatPane:""}
    </div>`;

  document.getElementById("msgEnd")?.scrollIntoView({behavior:"smooth"});
  document.getElementById("sendBtn")?.addEventListener("click", sendMsg);
  document.getElementById("chatInput")?.addEventListener("keydown", e => {
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMsg(); }
  });
}

function setView(v) { currentView=v; render(); }

async function sendMsg() {
  const inp = document.getElementById("chatInput");
  if(!inp||!inp.value.trim()||loading) return;
  const txt = inp.value.trim();
  inp.value="";
  displayMsgs.push({from:"user",text:txt});
  chatHistory.push({role:"user",content:txt});
  loading=true; render();

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        system:systemPrompt(),
        messages:chatHistory
      })
    });
    const data = await res.json();
    const raw = data.content?.[0]?.text||"{}";
    let parsed;
    try { parsed=JSON.parse(raw.replace(/```json\n?|```/g,"").trim()); }
    catch { parsed={reply:raw}; }

    if(parsed.name&&parsed.name!=="null") portfolio.name=parsed.name;
    if(parsed.tagline&&parsed.tagline!=="null") portfolio.tagline=parsed.tagline;
    if(parsed.skills) portfolio.skills=[...portfolio.skills,...parsed.skills.filter(s=>!portfolio.skills.some(x=>x.name.toLowerCase()===s.name.toLowerCase()))];
    if(parsed.grades) portfolio.grades=[...portfolio.grades,...parsed.grades.filter(g=>!portfolio.grades.some(x=>x.subject.toLowerCase()===g.subject.toLowerCase()))];
    if(parsed.abilities) portfolio.abilities=[...portfolio.abilities,...parsed.abilities.filter(a=>!portfolio.abilities.some(x=>x.title.toLowerCase()===a.title.toLowerCase()))];

    chatHistory.push({role:"assistant",content:raw});
    displayMsgs.push({from:"ai",text:parsed.reply||"Portfolio updated!"});
  } catch {
    displayMsgs.push({from:"ai",text:"Something went wrong, please try again!"});
  }
  loading=false; render();
}

render();
</script>
